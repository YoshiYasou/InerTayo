services:
  - type: web
    name: inertayo
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false